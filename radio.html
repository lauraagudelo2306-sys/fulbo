<style>
            .contenedor-principal-radio {
                max-width: 900px;
                margin: 0 auto;
                padding: 40px 20px;
            }

            .contenedor-radio-perillas {
                position: relative;
                display: block;
                width: 450px;
                margin: 30px auto;
            }

            .composicion-croquis {
                width: 100% !important;
                height: auto !important;
                display: block;
            }

            /* Botón perilla izquierda (Simétrico y centrado en la perilla) */
            #btn-relato {
                position: absolute;
                top: 59%;
                left: 28%; /* Ajustado simétricamente */
                width: 22px;
                height: 22px;
                background-color: #171717;
                border-radius: 50%;
                cursor: pointer;
                z-index: 10;
                transform: translate(-50%, -50%);
            }

            /* Botón perilla derecha (Simétrico y centrado en la perilla) */
            #btn-seleccion {
                position: absolute;
                top: 59%;
                left: 77.5%; /* Ajustado simétricamente */
                width: 22px;
                height: 22px;
                background-color: #171717;
                border-radius: 50%;
                cursor: pointer;
                z-index: 10;
                transform: translate(-50%, -50%);
            }

            .texto-pulsa {
                position: absolute;
                top: 26px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 11px;
                font-weight: bold;
                color: #171717;
                text-transform: uppercase;
                white-space: nowrap;
            }

            /* Balón pequeño en la esquina */
            .balon-volador {
                position: fixed;
                bottom: 25px;
                left: 25px;
                width: 40px !important;
                height: 40px !important;
                cursor: pointer;
                z-index: 9999;
                transition: transform 0.2s ease;
            }

            .balon-volador img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain;
                display: block;
            }

            .balon-volador:hover {
                transform: scale(1.15);
            }

            .volando {
                animation: parabolaImpacto 0.7s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
            }

            @keyframes parabolaImpacto {
                0% { transform: translate(0, 0) rotate(0deg) scale(1); }
                100% { transform: translate(60vw, -50vh) rotate(360deg) scale(0.3); opacity: 0; }
            }

            .texto-panagua,
            .texto-balon {
                display: none;
                background: #ffffff;
                border: 1.5px solid #171717;
                padding: 20px;
                margin: 20px auto;
                max-width: 450px;
                border-radius: 6px;
                box-shadow: 4px 4px 0px #171717;
            }

            .texto-panagua.activo-texto,
            .texto-balon.activo-texto {
                display: block;
            }
        </style>
